<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAYAA Admin</title><style>body{font-family:Arial,sans-serif;background:#f5f7f9;margin:0;color:#102027}.wrap{max-width:1100px;margin:40px auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.06)}.value{font-size:28px;font-weight:700;margin-top:8px}.muted{color:#65747b}.error{background:#fff0f0;color:#a33;padding:14px;border-radius:12px;margin-bottom:16px}h1{margin-bottom:6px}.refresh{margin:18px 0;padding:10px 14px;border:0;border-radius:10px;background:#0f766e;color:#fff;font-weight:700;cursor:pointer}</style></head><body><main class="wrap"><h1>BAYAA — Administration</h1><p class="muted">Suivi de la marketplace et des revenus BAYAA</p><button class="refresh" id="refresh">Actualiser</button><div id="msg"></div><section class="grid" id="stats"></section></main><script>const msg=document.getElementById('msg'),stats=document.getElementById('stats'),refresh=document.getElementById('refresh');const money=n=>Number(n||0).toLocaleString('fr-MR')+' MRU';async function load(){msg.innerHTML='';stats.innerHTML='';const token=localStorage.getItem('bayaa-token');if(!token){msg.innerHTML='<div class="error">Session BAYAA requise. Connectez-vous d’abord.</div>';return}try{const r=await fetch('/api/admin/stats',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Accès refusé');const cards=[['Ventes totales',money(d.grossSales)],['Ventes payées',money(d.paidSales)],['Commission estimée',money(d.estimatedCommission)],['Commandes',d.orders],['Commandes payées',d.paidOrders],['Vendeurs',d.sellers],['Utilisateurs',d.users],['Taux de commission',(Number(d.commissionRate)*100).toFixed(1)+'%']];stats.innerHTML=cards.map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}catch(e){msg.innerHTML='<div class="error">'+e.message+'</div>'}}refresh.addEventListener('click',load);load();</script></body></html>
