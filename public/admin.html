<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAYAA Admin</title><style>body{font-family:Arial,sans-serif;background:#f5f7f9;margin:0;color:#102027}.wrap{max-width:1100px;margin:40px auto;padding:20px}.panel,.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.06)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.value{font-size:28px;font-weight:700;margin-top:8px}.muted{color:#65747b}.error{background:#fff0f0;color:#a33;padding:14px;border-radius:12px;margin-bottom:16px}.success{background:#eefaf5;color:#176b4b;padding:14px;border-radius:12px;margin-bottom:16px}h1{margin-bottom:6px}input{display:block;width:100%;box-sizing:border-box;padding:12px;margin:10px 0;border:1px solid #d7dee2;border-radius:10px;font-size:16px}.btn{padding:11px 16px;border:0;border-radius:10px;background:#0f766e;color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#65747b;margin-left:8px}.hidden{display:none}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}</style></head><body><main class="wrap"><section id="loginPanel" class="panel"><h1>BAYAA — Connexion Admin</h1><p class="muted">Connectez-vous avec votre compte BAYAA autorisé pour accéder à l’administration.</p><form id="loginForm"><input id="email" type="email" autocomplete="username" placeholder="E-mail" required><input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe" required><button class="btn" type="submit">Se connecter</button></form><div id="loginMsg"></div></section><section id="adminPanel" class="hidden"><div class="header"><div><h1>BAYAA — Administration</h1><p class="muted">Suivi de la marketplace et des revenus BAYAA</p></div><div class="row"><button class="btn" id="refresh">Actualiser</button><button class="btn secondary" id="logout">Déconnexion</button></div></div><div id="msg"></div><section class="grid" id="stats"></section></section></main><script>const loginPanel=document.getElementById('loginPanel'),adminPanel=document.getElementById('adminPanel'),loginForm=document.getElementById('loginForm'),loginMsg=document.getElementById('loginMsg'),msg=document.getElementById('msg'),stats=document.getElementById('stats'),refresh=document.getElementById('refresh'),logout=document.getElementById('logout');const money=n=>Number(n||0).toLocaleString('fr-MR')+' MRU';const tokenKey='bayaa-token';function setMessage(el,text,type='error'){el.innerHTML=text?`<div class="${type}">${text}</div>`:''}async function load(){const token=localStorage.getItem(tokenKey);if(!token){loginPanel.classList.remove('hidden');adminPanel.classList.add('hidden');return}try{const r=await fetch('/api/admin/stats',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok){if(r.status===401||r.status===403){localStorage.removeItem(tokenKey);loginPanel.classList.remove('hidden');adminPanel.classList.add('hidden');}throw new Error(d.error||'Accès refusé')}loginPanel.classList.add('hidden');adminPanel.classList.remove('hidden');setMessage(msg,'','success');const cards=[['Ventes totales',money(d.grossSales)],['Ventes payées',money(d.paidSales)],['Commission estimée',money(d.estimatedCommission)],['Commandes',d.orders],['Commandes payées',d.paidOrders],['Vendeurs',d.sellers],['Utilisateurs',d.users],['Taux de commission',(Number(d.commissionRate)*100).toFixed(1)+'%']];stats.innerHTML=cards.map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}catch(e){if(localStorage.getItem(tokenKey))setMessage(msg,e.message)}}loginForm.addEventListener('submit',async e=>{e.preventDefault();setMessage(loginMsg,'');try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Connexion échouée.');if(d.user?.role!=='buyer'&&d.user?.role!=='seller')throw new Error('Compte invalide.');localStorage.setItem(tokenKey,d.token);password.value='';await load()}catch(e){setMessage(loginMsg,e.message)}});refresh.addEventListener('click',load);logout.addEventListener('click',()=>{localStorage.removeItem(tokenKey);stats.innerHTML='';setMessage(msg,'');loginPanel.classList.remove('hidden');adminPanel.classList.add('hidden');loginForm.reset()});load();</script></body></html>
